[package]
name = "crw-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HTTP and CDP browser rendering engine for the CRW web scraper"

[features]
default = []
cdp = ["tokio-tungstenite", "crw-core/cdp"]
auto-browser = ["dep:dirs"]
# Camofox (camofox-browser REST) renderer tier. Pure-reqwest; no extra deps.
camofox = []
# Chrome-impersonation HTTP tier (wreq). Default off so the lean build never
# links the wreq/BoringSSL stack. Forwards to `crw-core/impersonated` for the
# config-level predicate.
impersonated = ["crw-core/impersonated", "dep:wreq", "dep:wreq-util"]

[dependencies]
crw-core = { workspace = true }
crw-extract = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"], optional = true }
futures = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
rand = { workspace = true }
dashmap = { workspace = true }
dirs = { version = "6", optional = true }
moka = { workspace = true }
publicsuffix = { workspace = true }
regex = { workspace = true }
encoding_rs = "0.8"
# Chrome TLS/JA3/HTTP2 impersonation client (impersonated feature only).
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
flate2 = "1"
brotli = "8"
